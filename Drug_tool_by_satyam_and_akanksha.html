<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced In-Silico Drug Design Platform</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Animations -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
  font-family:'Poppins',sans-serif;
  box-sizing:border-box;
}
body{
  background:radial-gradient(circle at top,#1e3c72,#0f2027 60%);
  color:white;
  margin:0;
  min-height:100vh;
}
header{
  padding:30px;
  text-align:center;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(0,0,0,0.6);
}
header h1{
  font-size:34px;
  margin-bottom:8px;
}
header p{
  opacity:0.85;
}
.credit{
  margin-top:10px;
  font-size:14px;
  opacity:0.75;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:40px 25px;
}
.search-box{
  display:flex;
  gap:12px;
}
input{
  flex:1;
  padding:16px;
  border-radius:12px;
  border:none;
  font-size:16px;
  outline:none;
}
button{
  padding:16px 35px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#00f260,#0575e6);
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.4s;
  position:relative;
  overflow:hidden;
}
button::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);
  transform:translateX(-100%);
}
button:hover::after{
  transform:translateX(100%);
  transition:0.6s;
}
button:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px #00f260;
}
.card{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(14px);
  margin-top:30px;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.7);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:20px;
}
.grid div{
  background:rgba(0,0,0,0.25);
  padding:15px;
  border-radius:14px;
  text-align:center;
}
.value{
  font-size:20px;
  font-weight:600;
  color:#00f260;
  margin-top:6px;
}
#pdfBtn{
  margin-top:25px;
}
.footer{
  text-align:center;
  padding:18px;
  font-size:14px;
  opacity:0.7;
  background:rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<header class="animate__animated animate__fadeInDown">
  <h1>🔬 Advanced In-Silico Drug Design Tool</h1>
  <p>Real-Time Molecular Analysis using PubChem Database</p>
  <div class="credit">
    Project made by <b>Satyam Jha</b> and <b>Akanksha Singh</b><br>
    [BT 3rd Year, SRIMT, Lucknow]
  </div>
</header>

<div class="container">

<div class="search-box">
<input id="compound" placeholder="Enter compound name (e.g. Aspirin)">
<button onclick="searchCompound()">Analyze</button>
</div>

<div id="result"></div>

<button id="pdfBtn" style="display:none;" onclick="generatePDF()">📄 Download PDF Report</button>

</div>

<div class="footer">
© 2026 | In-Silico Drug Discovery Platform | Academic Research Project
</div>

<script>
async function searchCompound(){
  const name=document.getElementById("compound").value;
  if(!name) return alert("Enter compound name");

  document.getElementById("result").innerHTML="⏳ Fetching real data from PubChem...";

  try{
    const cidRes=await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${name}/cids/JSON`);
    const cidData=await cidRes.json();
    const cid=cidData.IdentifierList.CID[0];

    const propRes=await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/MolecularWeight,XLogP,HBondDonorCount,HBondAcceptorCount,RotatableBondCount/JSON`);
    const prop=await propRes.json().then(d=>d.PropertyTable.Properties[0]);

    document.getElementById("result").innerHTML=`
    <div class="card animate__animated animate__fadeInUp">
      <h2>🧪 Compound Analysis: ${name}</h2>
      <div class="grid">
        <div>Molecular Weight<div class="value">${prop.MolecularWeight}</div></div>
        <div>XLogP<div class="value">${prop.XLogP}</div></div>
        <div>H-Bond Donors<div class="value">${prop.HBondDonorCount}</div></div>
        <div>H-Bond Acceptors<div class="value">${prop.HBondAcceptorCount}</div></div>
        <div>Rotatable Bonds<div class="value">${prop.RotatableBondCount}</div></div>
      </div>
      <p style="margin-top:18px;opacity:0.85;">
        ✔ Drug-likeness evaluated using Lipinski's Rule of Five
      </p>
    </div>`;
    document.getElementById("pdfBtn").style.display="inline-block";
  }
  catch{
    document.getElementById("result").innerHTML="❌ Compound not found in PubChem database";
  }
}

function generatePDF(){
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF();
  pdf.text("Advanced In-Silico Drug Design Report",20,20);
  pdf.text("Project made by Satyam Jha & Akanksha Singh",20,30);
  pdf.text("[BT 3rd Year, SRIMT, Lucknow]",20,38);
  pdf.text(document.getElementById("result").innerText,20,50);
  pdf.save("InSilico_Drug_Report.pdf");
}
</script>

</body>
</html>
